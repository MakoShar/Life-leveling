<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solo Leveling — Register</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <style>
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-card {
      background: linear-gradient(135deg, rgba(139, 90, 43, 0.3), rgba(0, 0, 0, 0.5));
      padding: 40px;
      border-radius: 12px;
      border: 2px solid #8b5a2b;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      text-align: center;
      max-width: 400px;
      width: 100%;
      position: relative;
    }
    .back-link {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #b8956a;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.3s;
    }
    .back-link:hover {
      color: #d4af37;
    }
    .login-card h1 {
      color: #d4af37;
      text-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
      margin-bottom: 20px;
      font-size: 2.5rem;
    }
    .login-subtitle {
      color: #b8956a;
      margin-bottom: 30px;
    }
    .login-btn {
      background: linear-gradient(135deg, #d4af37, #8b5a2b);
      color: #000;
      border: none;
      padding: 15px 30px;
      font-size: 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
      width: 100%;
      margin-top: 10px;
    }
    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
    }
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .form-group label {
      display: block;
      color: #b8956a;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid rgba(184, 149, 106, 0.3);
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 1rem;
    }
    .auth-link {
      margin-top: 20px;
      display: block;
      color: #b8956a;
      font-size: 0.9rem;
      text-decoration: none;
      transition: color 0.3s;
    }
    .auth-link:hover {
      color: #d4af37;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <a href="index.html" class="back-link">← Back to System</a>
      <h1>Awaken</h1>
      <p class="login-subtitle">Register to become a Hunter.</p>
      
      <form id="registerForm">
        <div class="form-group">
          <label for="name">Hunter Name</label>
          <input type="text" id="name" required placeholder="Sung Jin-Woo">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="hunter@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="6" placeholder="••••••••">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" required minlength="6" placeholder="••••••••">
        </div>
        <button type="submit" id="registerBtn" class="login-btn">Register</button>
      </form>
      
      <a href="login.html" class="auth-link">Already a Hunter? Sign in here.</a>
    </div>
  </div>
  <script src="register.js"></script>
</body>
</html>
